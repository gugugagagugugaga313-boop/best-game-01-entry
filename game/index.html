<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — Keep the Last Light Burning</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #080a1a;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Verdana, Geneva, sans-serif;
  }
  canvas {
    display: block;
    background: #0b1026;
    cursor: crosshair;
    image-rendering: auto;
    box-shadow: 0 0 60px rgba(255, 179, 71, 0.12);
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Emberfall: defend the Ember through ten waves of night"></canvas>
<p id="status" class="sr-only" role="status" aria-live="polite">Emberfall. Title screen.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
